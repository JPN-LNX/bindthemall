name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build APK
        run: ./gradlew :app:assembleFreeDebug
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: antennapod-actus-apk
          path: app/build/outputs/apk/free/debug/*.apk
